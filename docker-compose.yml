services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fila_atendimento}
      POSTGRES_USER: ${POSTGRES_USER:-fila_atendimento}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_only_change_me}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - fila_atendimento_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  fila_atendimento_postgres_data:
